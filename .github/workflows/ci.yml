name: CI

on:
  push:
    branches: [arm64-v1.4-beta.3] # push directo a la default; PRs vía pull_request
  pull_request:

jobs:
  syntax-and-install:
    name: Syntax check + dependency install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check every JS file (node --check)
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Install dependencies (verifies package.json resolves)
        run: npm install --no-audit --no-fund

      - name: Verify core deps load
        run: node -e "require('pokehint'); require('@tensorflow/tfjs-core'); require('sharp'); console.log('core deps OK')"
